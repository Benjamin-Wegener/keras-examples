<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training-Fortschritt</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #657085; --line: #e2e5ea;
    --accent: #2563eb; --good: #15803d; --bad: #b91c1c; --warn: #b45309; --chip: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --card: #1a1f28; --text: #e7eaf0; --muted: #98a2b3; --line: #2a303b;
            --accent: #6ea0ff; --good: #4ade80; --bad: #f87171; --warn: #fbbf24; --chip: #242b36; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 5; }
  h1 { font-size: 18px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  main { max-width: 1400px; margin: 0 auto; padding: 20px 24px 60px; display: grid; gap: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .card-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .card-head h2 { font-size: 17px; margin: 0; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--chip); color: var(--muted); margin-left: 8px; }
  .badge.running { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .badge.stopped, .badge.finished { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
  .badge.crashed, .badge.stalled { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 7px 14px; }
  button.stop { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 600; }
  button:disabled { opacity: .4; cursor: default; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
  .stat { background: var(--chip); border-radius: 8px; padding: 8px 12px; }
  .stat b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .6s; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .chart h3 { margin: 0 0 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
  canvas { width: 100%; height: 190px; display: block; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .gallery-title { font-size: 13px; color: var(--muted); margin: 6px 0 8px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  figure { margin: 0; }
  figure img { width: 100%; border-radius: 6px; border: 1px solid var(--line); display: block; background: var(--chip); min-height: 40px; }
  figcaption { font-size: 12px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .pos { color: var(--good); font-weight: 600; } .neg { color: var(--bad); font-weight: 600; }
  pre { white-space: pre-wrap; background: var(--chip); padding: 10px; border-radius: 8px; font-size: 12px; max-height: 240px; overflow: auto; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Training von Null auf Set14</h1>
    <div class="sub">Architektur aus dlss5-distill · pro Bild: Eingabe | Ergebnis | Original · aktualisiert <span id="upd">–</span></div>
  </div>
  <button id="stop-all" class="stop">Alles beenden</button>
</header>
<main id="main"></main>

<script>
const LABEL = {
  superresolution: { title: 'Superresolution (2x)', base: 'Bicubic' },
  inpainting:      { title: 'Inpainting',           base: 'Eingabe mit Löchern' },
  deblurring:      { title: 'Deblurring',           base: 'Eingabe (verwischt)' },
};
const STATE = { 'not started': 'nicht gestartet', starting: 'startet', running: 'läuft', stopped: 'von dir gestoppt',
                finished: 'Zeitlimit erreicht', skipped: 'übersprungen', crashed: 'abgestürzt', stalled: 'reagiert nicht' };

const main = document.getElementById('main');
const cards = {};

function fmtTime(s) {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h} h ${String(m).padStart(2, '0')} min` : `${m} min ${String(s % 60).padStart(2, '0')} s`;
}

function ensureCard(name) {
  if (cards[name]) return cards[name];
  const el = document.createElement('section');
  el.className = 'card';
  el.innerHTML = `
    <div class="card-head">
      <h2>${LABEL[name].title}<span class="badge" data-k="badge"></span></h2>
      <button class="stop" data-k="stop">Stopp – reicht mir</button>
    </div>
    <div class="stats" data-k="stats"></div>
    <div class="bar"><div data-k="bar"></div></div>
    <div class="charts">
      <div class="chart"><h3>Loss (L1, geglättet)</h3><canvas data-k="loss"></canvas></div>
      <div class="chart"><h3>PSNR auf allen 14 Set14-Bildern (Mittel, dB)</h3><canvas data-k="psnr"></canvas>
        <div class="legend"><span><i style="background:var(--accent)"></i>Modell</span><span><i style="background:var(--muted)"></i>${LABEL[name].base}</span></div></div>
    </div>
    <pre data-k="msg" hidden></pre>
    <div class="gallery-title" data-k="gtitle">Noch keine Bilder.</div>
    <div class="gallery" data-k="gallery"></div>`;
  main.appendChild(el);
  const c = { el, v: {}, version: -1 };
  el.querySelectorAll('[data-k]').forEach(n => c.v[n.dataset.k] = n);
  c.v.stop.onclick = () => {
    if (confirm(c.v.stop.textContent === 'Überspringen' ? `${LABEL[name].title} überspringen?` : `${LABEL[name].title} wirklich beenden? Der aktuelle Stand wird gespeichert, danach startet das nächste Beispiel.`))
      fetch(`/api/stop/${name}`, { method: 'POST' }).then(poll);
  };
  cards[name] = c;
  return c;
}

function drawChart(canvas, series, fmtY) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const g = canvas.getContext('2d');
  g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const line = css.getPropertyValue('--line').trim(), muted = css.getPropertyValue('--muted').trim();
  const pts = series.flatMap(s => s.points);
  g.font = '11px sans-serif';
  if (pts.length < 2) { g.fillStyle = muted; g.fillText('wartet auf Daten …', 10, 20); return; }
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y1 - y0 < 1e-9) { y0 -= 1; y1 += 1; }
  const pad = (y1 - y0) * 0.08; y0 -= pad; y1 += pad;
  const L = 46, R = 8, T = 8, B = 20;
  const X = x => L + (x - x0) / Math.max(1e-9, x1 - x0) * (w - L - R);
  const Y = y => T + (1 - (y - y0) / (y1 - y0)) * (h - T - B);
  g.strokeStyle = line; g.fillStyle = muted; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = y0 + (y1 - y0) * i / 4;
    g.beginPath(); g.moveTo(L, Y(y)); g.lineTo(w - R, Y(y)); g.stroke();
    g.fillText(fmtY(y), 4, Y(y) + 4);
  }
  for (let i = 0; i <= 4; i++) {
    const x = x0 + (x1 - x0) * i / 4;
    const m = x / 60, label = m < 90 ? Math.round(m) + ' min' : (m / 60).toFixed(1) + ' h';
    g.fillText(label, Math.min(w - 40, Math.max(L - 10, X(x) - 16)), h - 5);
  }
  for (const s of series) {
    g.strokeStyle = s.color; g.lineWidth = 2; g.beginPath();
    s.points.forEach((p, i) => i ? g.lineTo(X(p[0]), Y(p[1])) : g.moveTo(X(p[0]), Y(p[1])));
    g.stroke();
  }
}

function render(name, st) {
  const c = ensureCard(name), v = c.v;
  const state = st.state || 'not started';
  v.badge.textContent = STATE[state] || state;
  v.badge.className = 'badge ' + state.replace(' ', '-');
  v.stop.disabled = !['running', 'starting', 'stalled', 'not started'].includes(state);
  v.stop.textContent = state === 'not started' ? 'Überspringen' : 'Stopp – reicht mir';
  if (state === 'not started' || state === 'skipped') { v.stats.innerHTML = `<div class="stat"><b>–</b><span>${state === 'skipped' ? 'übersprungen' : 'wartet, bis das vorherige Beispiel fertig ist'}</span></div>`; return; }

  const last = (st.psnr_history || []).slice(-1)[0];
  const delta = last ? last[2] - last[3] : null;
  const stat = (val, lab) => `<div class="stat"><b>${val}</b><span>${lab}</span></div>`;
  v.stats.innerHTML =
    stat(`${fmtTime(st.elapsed || 0)} / ${fmtTime(st.max_seconds || 0)}`, 'Trainingszeit') +
    stat((st.step || 0).toLocaleString('de-DE'), `Schritte (${(st.steps_per_sec || 0).toFixed(1)}/s)`) +
    stat(st.loss == null ? '–' : st.loss.toFixed(4), 'Loss') +
    stat(last ? last[2].toFixed(2) + ' dB' : '–', 'PSNR Modell') +
    stat(last ? `<span class="${delta >= 0 ? 'pos' : 'neg'}" style="font-size:inherit">${delta >= 0 ? '+' : ''}${delta.toFixed(2)} dB</span>` : '–', `Abstand zu ${LABEL[name].base}`) +
    stat((st.lr || 0).toExponential(1), 'Lernrate') +
    stat((st.params || 0).toLocaleString('de-DE'), 'Parameter (Training)');
  v.bar.style.width = Math.min(100, 100 * (st.elapsed || 0) / (st.max_seconds || 1)) + '%';

  drawChart(v.loss, [{ color: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(), points: (st.history || []).map(h => [h[0], h[2]]) }], y => y.toFixed(3));
  const css = getComputedStyle(document.documentElement);
  drawChart(v.psnr, [
    { color: css.getPropertyValue('--muted').trim(), points: (st.psnr_history || []).map(h => [h[0], h[3]]) },
    { color: css.getPropertyValue('--accent').trim(), points: (st.psnr_history || []).map(h => [h[0], h[2]]) },
  ], y => y.toFixed(1));

  v.msg.hidden = !st.message || state === 'running';
  v.msg.textContent = st.message || '';

  if (st.eval_version !== c.version && st.images) {
    c.version = st.eval_version;
    const when = st.eval_time ? new Date(st.eval_time * 1000).toLocaleTimeString('de-DE') : '–';
    v.gtitle.textContent = `Stand der letzten Auswertung: ${when} (Schritt ${last ? last[1].toLocaleString('de-DE') : '–'}) · Reihenfolge: Eingabe | Ergebnis | Original`;
    v.gallery.innerHTML = Object.entries(st.images).map(([img, d]) => {
      const dm = d.psnr_model, db = d.psnr_base;
      const diff = dm == null ? '' : ` <span class="${dm >= db ? 'pos' : 'neg'}">${dm >= db ? '+' : ''}${(dm - db).toFixed(2)}</span>`;
      return `<figure><img loading="lazy" src="/runs/${name}/img/${img}.jpg?v=${st.eval_version}" alt="${img}">
        <figcaption>${img} · Modell ${dm == null ? '–' : dm.toFixed(2)} dB · ${LABEL[name].base} ${db.toFixed(2)} dB${diff}</figcaption></figure>`;
    }).join('');
  }
}

async function poll() {
  try {
    const r = await (await fetch('/api/status')).json();
    for (const name of Object.keys(LABEL)) render(name, r.runs[name] || { state: 'not started' });
    document.getElementById('upd').textContent = new Date(r.now * 1000).toLocaleTimeString('de-DE');
  } catch (e) {
    document.getElementById('upd').textContent = 'Server nicht erreichbar';
  }
}
document.getElementById('stop-all').onclick = () => {
  if (confirm('Das laufende Training beenden und alle weiteren überspringen? Der Stand wird gespeichert.')) fetch('/api/stop/all', { method: 'POST' }).then(poll);
};
poll(); setInterval(poll, 4000);
</script>
</body>
</html>
